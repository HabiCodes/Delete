<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Account Confirmation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e7eb;
    }

    .icon-container {
      width: 48px;
      height: 48px;
      background-color: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .icon-container svg {
      width: 24px;
      height: 24px;
      color: #dc2626;
    }

    h2 {
      font-size: 1.25rem;
      color: #111827;
      margin-bottom: 8px;
      font-weight: 600;
    }

    p {
      font-size: 0.875rem;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .warning-box {
      background-color: #fff1f2;
      border-left: 4px solid #f43f5e;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 0.8125rem;
      color: #9f1239;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .btn {
      padding: 10px 16px;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .btn-cancel {
      background-color: #ffffff;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    .btn-cancel:hover {
      background-color: #f9fafb;
    }

    .btn-delete {
      background-color: #dc2626;
      color: #ffffff;
    }

    .btn-delete:hover {
      background-color: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>

    <h2>Delete Account</h2>
    <p>Are you sure you want to delete your account? All of your data, settings, and active subscriptions will be permanently removed.</p>

    <div class="warning-box">
      <strong>Warning:</strong> This action is permanent and cannot be undone.
    </div>

    <form>
      <div class="input-group">
        <label for="confirmText">Type <strong>DELETE</strong> to confirm:</label>
        <input type="text" id="confirmText" placeholder="DELETE" required>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-cancel">Cancel</button>
        <button type="submit" class="btn btn-delete">Delete My Account</button>
      </div>
    </form>
  </div>

</body>
</html>
